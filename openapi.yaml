openapi: 3.0.3
info:
  title: Edoha API
  description: |
    API REST para gestão de rifas/loterias. Multi-tenant por instituição.

    ## Autenticação
    Todas as rotas (exceto `POST /auth`) exigem Bearer JWT no header:
    ```
    Authorization: Bearer <accessToken>
    ```
    O token é obtido em `POST /auth` e expira em 60 minutos.

    ## Autorização
    Além do JWT, cada endpoint verifica a permissão do usuário via `PermissionPolicy`.
    A permissão é definida por Page (controller) + Action (método HTTP).

    ## Hierarquia de recursos
    ```
    Institution
      └── Lottery
            └── Ticketbook
                  └── Ticket
    ```

    ## Erros de validação
    Retornados como HTTP 400 com corpo `{ is_valid: false, errors: { campo: ["msg"] } }`.
  version: 1.0.0

servers:
  - url: http://{host}
    variables:
      host:
        default: localhost:5000
        description: Host da API

tags:
  - name: Auth
    description: Autenticação — único endpoint público
  - name: Action
    description: Ações (HTTP verbs) usadas no sistema de permissões
  - name: Institution
    description: Instituições (tenants) que gerenciam rifas
  - name: Lottery
    description: Rifas vinculadas a uma instituição
  - name: Page
    description: Páginas (controllers) usadas no sistema de permissões
  - name: Permission
    description: Perfis de permissão vinculados a instituições
  - name: StatusTicketbook
    description: Status possíveis de um talão (ex: Retirado, Devolvido)
  - name: TableConfiguration
    description: Metadados de colunas de tabelas do banco
  - name: Ticket
    description: Bilhetes individuais de um talão
  - name: Ticketbook
    description: Talões de uma rifa (cada talão tem N bilhetes)
  - name: User
    description: Usuários do sistema
  - name: UserInstitution
    description: Vínculo entre usuários e instituições
  - name: UserPermission
    description: Permissões atribuídas a usuários
  - name: UserType
    description: Tipos de usuário

security:
  - BearerAuth: []

paths:

  # ─── Auth ───────────────────────────────────────────────────────────────────

  /auth:
    post:
      tags: [Auth]
      summary: Autenticar usuário
      description: Recebe nickname + senha em texto puro. Retorna JWT e instituições vinculadas.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialsDTO'
            example:
              nickname: john.doe
              password: secret123
      responses:
        '200':
          description: Autenticação bem-sucedida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Credenciais inválidas

  # ─── Action ─────────────────────────────────────────────────────────────────

  /action:
    get:
      tags: [Action]
      summary: Listar actions
      responses:
        '200':
          description: Lista de actions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Action'
        '204':
          description: Nenhuma action encontrada
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Action]
      summary: Criar action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateActionDTO'
      responses:
        '200':
          description: Action criada com sucesso
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Action]
      summary: Atualizar action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateActionDTO'
      responses:
        '200':
          description: Action atualizada com sucesso
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /action/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Action]
      summary: Buscar action por ID
      responses:
        '200':
          description: Action encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Action'
        '404':
          description: Action não encontrada
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Action]
      summary: Excluir action
      responses:
        '200':
          description: Action excluída com sucesso
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ─── Institution ─────────────────────────────────────────────────────────────

  /institution:
    get:
      tags: [Institution]
      summary: Listar instituições
      responses:
        '200':
          description: Lista de instituições
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Institution'
        '204':
          description: Nenhuma instituição encontrada
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Institution]
      summary: Criar instituição
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInstitutionDTO'
      responses:
        '200':
          description: Instituição criada com sucesso
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Institution]
      summary: Atualizar instituição
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInstitutionDTO'
      responses:
        '200':
          description: Instituição atualizada com sucesso
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /institution/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Slug da instituição (ex: minha-instituicao)
    get:
      tags: [Institution]
      summary: Buscar instituição por slug
      responses:
        '200':
          description: Instituição encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Institution'
        '204':
          description: Instituição não encontrada
        '401':
          $ref: '#/components/responses/Unauthorized'

  /institution/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      tags: [Institution]
      summary: Excluir instituição
      responses:
        '200':
          description: Instituição excluída com sucesso
        '401':
          $ref: '#/components/responses/Unauthorized'

  /institution/institution_by_user/{idUser}:
    parameters:
      - name: idUser
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ID do usuário
    get:
      tags: [Institution]
      summary: Listar instituições de um usuário
      responses:
        '200':
          description: Lista de instituições do usuário
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Institution'
        '204':
          description: Nenhuma instituição encontrada
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ─── Lottery ─────────────────────────────────────────────────────────────────

  /institution/{idInstitution}/lottery:
    parameters:
      - name: idInstitution
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ID da instituição
    get:
      tags: [Lottery]
      summary: Listar rifas de uma instituição
      responses:
        '200':
          description: Lista de rifas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Lottery'
        '204':
          description: Nenhuma rifa encontrada
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Lottery]
      summary: Criar rifa
      description: O campo `idInstitution` no body é ignorado — usa-se o `idInstitution` da rota.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLotteryDTO'
      responses:
        '200':
          description: Rifa criada com sucesso
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Lottery]
      summary: Atualizar rifa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLotteryDTO'
      responses:
        '200':
          description: Rifa atualizada com sucesso
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /institution/{idInstitution}/lottery/{id}:
    parameters:
      - name: idInstitution
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Lottery]
      summary: Buscar rifa por ID
      responses:
        '200':
          description: Rifa encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lottery'
        '204':
          description: Rifa não encontrada
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Lottery]
      summary: Excluir rifa
      responses:
        '200':
          description: Rifa excluída com sucesso
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ─── Page ────────────────────────────────────────────────────────────────────

  /api/page:
    get:
      tags: [Page]
      summary: Listar pages
      responses:
        '200':
          description: Lista de pages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Page'
        '204':
          description: Nenhuma page encontrada
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Page]
      summary: Criar page
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePage'
      responses:
        '200':
          description: Page criada com sucesso
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Page]
      summary: Atualizar page
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePage'
      responses:
        '200':
          description: Page atualizada com sucesso
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/page/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Page]
      summary: Buscar page por ID
      responses:
        '200':
          description: Page encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '404':
          description: Page não encontrada
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Page]
      summary: Excluir page
      responses:
        '200':
          description: Page excluída com sucesso
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ─── Permission ──────────────────────────────────────────────────────────────

  /permission:
    get:
      tags: [Permission]
      summary: Listar permissões
      responses:
        '200':
          description: Lista de permissões
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Permission'
        '204':
          description: Nenhuma permissão encontrada
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Permission]
      summary: Criar permissão
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePermissionDTO'
      responses:
        '200':
          description: Permissão criada com sucesso
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Permission]
      summary: Atualizar permissão
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePermissionDTO'
      responses:
        '200':
          description: Permissão atualizada com sucesso
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /permission/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Permission]
      summary: Buscar permissão por ID
      responses:
        '200':
          description: Permissão encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Permission'
        '404':
          description: Permissão não encontrada
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Permission]
      summary: Excluir permissão
      responses:
        '200':
          description: Permissão excluída com sucesso
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ─── StatusTicketbook ────────────────────────────────────────────────────────

  /statusticketbook:
    get:
      tags: [StatusTicketbook]
      summary: Listar status de talões
      responses:
        '200':
          description: Lista de status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StatusTicketbook'
        '204':
          description: Nenhum status encontrado
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [StatusTicketbook]
      summary: Criar status de talão
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStatusTicketbookDTO'
      responses:
        '200':
          description: Status criado com sucesso
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [StatusTicketbook]
      summary: Atualizar status de talão
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStatusTicketbookDTO'
      responses:
        '200':
          description: Status atualizado com sucesso
        '401':
          $ref: '#/components/responses/Unauthorized'

  /statusticketbook/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [StatusTicketbook]
      summary: Buscar status de talão por ID
      responses:
        '200':
          description: Status encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusTicketbook'
        '204':
          description: Status não encontrado
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [StatusTicketbook]
      summary: Excluir status de talão
      responses:
        '200':
          description: Status excluído com sucesso
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ─── TableConfiguration ──────────────────────────────────────────────────────

  /tableconfiguration/{schema}/{tableName}:
    parameters:
      - name: schema
        in: path
        required: true
        schema:
          type: string
        description: "Nome do schema do banco (ex: edoha, lottery)"
      - name: tableName
        in: path
        required: true
        schema:
          type: string
        description: Nome da tabela
    get:
      tags: [TableConfiguration]
      summary: Buscar configuração de colunas de uma tabela
      description: Retorna metadados das colunas da tabela (information_schema).
      responses:
        '200':
          description: Lista de colunas da tabela
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TableConfiguration'
        '204':
          description: Tabela não encontrada
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ─── Ticket ──────────────────────────────────────────────────────────────────

  /ticketbook/{idTicketbook}/ticket:
    parameters:
      - name: idTicketbook
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ID do talão
    get:
      tags: [Ticket]
      summary: Listar bilhetes de um talão
      responses:
        '200':
          description: Lista de bilhetes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ticket'
        '204':
          description: Nenhum bilhete encontrado
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Ticket]
      summary: Criar bilhetes em lote
      description: Cria múltiplos bilhetes para o talão. O `idTicketbook` vem da rota.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CreateTicketRequest'
      responses:
        '201':
          description: Bilhetes criados com sucesso
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Ticket]
      summary: Atualizar bilhete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTicketDTO'
      responses:
        '200':
          description: Bilhete atualizado com sucesso
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /ticketbook/{idTicketbook}/ticket/{id}:
    parameters:
      - name: idTicketbook
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Ticket]
      summary: Buscar bilhete por ID
      responses:
        '200':
          description: Bilhete encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '204':
          description: Bilhete não encontrado
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Ticket]
      summary: Excluir bilhete
      responses:
        '200':
          description: Bilhete excluído com sucesso
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ─── Ticketbook ──────────────────────────────────────────────────────────────

  /lottery/{idLottery}/ticketbook:
    parameters:
      - name: idLottery
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ID da rifa
    get:
      tags: [Ticketbook]
      summary: Listar todos os talões de uma rifa
      responses:
        '200':
          description: Lista de talões
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ticketbook'
        '204':
          description: Nenhum talão encontrado
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Ticketbook]
      summary: Criar talão
      description: |
        Owner e Holder são identificados pelo nome e telefone. Se não existir usuário com
        esse telefone, um novo é criado automaticamente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostTicketbookRequest'
            example:
              ticketbookOwner:
                name: João Silva
                phone: "11999999999"
              ticketbookHolder:
                name: Maria Souza
                phone: "11988888888"
              idStatusTicketbook: 1
              number: 42
              withdrawnDate: "2026-06-01T00:00:00Z"
      responses:
        '201':
          description: Talão criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostTicketbookResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Ticketbook]
      summary: Atualizar talão
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTicketbookDTO'
      responses:
        '200':
          description: Talão atualizado com sucesso
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /lottery/{idLottery}/ticketbook/returneds:
    parameters:
      - name: idLottery
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Ticketbook]
      summary: Listar talões devolvidos (status = 2)
      responses:
        '200':
          description: Lista de talões devolvidos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ticketbook'
        '204':
          description: Nenhum talão devolvido
        '401':
          $ref: '#/components/responses/Unauthorized'

  /lottery/{idLottery}/ticketbook/withdrawns:
    parameters:
      - name: idLottery
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Ticketbook]
      summary: Listar talões retirados (status = 1)
      responses:
        '200':
          description: Lista de talões retirados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ticketbook'
        '204':
          description: Nenhum talão retirado
        '401':
          $ref: '#/components/responses/Unauthorized'

  /lottery/{idLottery}/ticketbook/ticketbook_by_number/{numberTicketbook}:
    parameters:
      - name: idLottery
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: numberTicketbook
        in: path
        required: true
        schema:
          type: integer
        description: Número do talão
    get:
      tags: [Ticketbook]
      summary: Buscar talão por número
      responses:
        '200':
          description: Talão encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticketbook'
        '204':
          description: Talão não encontrado
        '401':
          $ref: '#/components/responses/Unauthorized'

  /lottery/{idLottery}/ticketbook/{id}:
    parameters:
      - name: idLottery
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Ticketbook]
      summary: Buscar talão por ID
      responses:
        '200':
          description: Talão encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticketbook'
        '204':
          description: Talão não encontrado
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Ticketbook]
      summary: Excluir talão
      responses:
        '200':
          description: Talão excluído com sucesso
        '401':
          $ref: '#/components/responses/Unauthorized'

  /lottery/{idLottery}/ticketbook/{idTicketbook}/status/{idStatusTicketbook}:
    parameters:
      - name: idLottery
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: idTicketbook
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: idStatusTicketbook
        in: path
        required: true
        schema:
          type: integer
        description: "ID do novo status (1=Retirado, 2=Devolvido)"
    patch:
      tags: [Ticketbook]
      summary: Atualizar status do talão para qualquer valor
      responses:
        '204':
          description: Status atualizado com sucesso
        '401':
          $ref: '#/components/responses/Unauthorized'

  /lottery/{idLottery}/ticketbook/{idTicketbook}/status/returned:
    parameters:
      - name: idLottery
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: idTicketbook
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Ticketbook]
      summary: Marcar talão como devolvido (status = 2)
      description: Atalho semântico — equivale a PATCH status/2.
      responses:
        '204':
          description: Talão marcado como devolvido
        '401':
          $ref: '#/components/responses/Unauthorized'

  /lottery/{idLottery}/ticketbook/{idTicketbook}/status/withdraw:
    parameters:
      - name: idLottery
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: idTicketbook
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Ticketbook]
      summary: Marcar talão como retirado (status = 1)
      description: Atalho semântico — equivale a PATCH status/1.
      responses:
        '204':
          description: Talão marcado como retirado
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ─── User ────────────────────────────────────────────────────────────────────

  /user:
    get:
      tags: [User]
      summary: Listar usuários
      responses:
        '200':
          description: Lista de usuários
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '204':
          description: Nenhum usuário encontrado
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [User]
      summary: Criar usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserInputModel'
      responses:
        '200':
          description: Usuário criado com sucesso
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [User]
      summary: Atualizar usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserDTO'
      responses:
        '200':
          description: Usuário atualizado com sucesso
        '401':
          $ref: '#/components/responses/Unauthorized'

  /user/user_information:
    get:
      tags: [User]
      summary: Listar informações resumidas de usuários
      description: |
        Retorna lista de usuários com informações básicas. Quando `withTicketbooks=true`,
        inclui dados dos talões vinculados.
      parameters:
        - name: withTicketbooks
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Incluir talões vinculados ao usuário
      responses:
        '200':
          description: Lista de informações de usuários
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserInformationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /user/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [User]
      summary: Buscar usuário por ID
      responses:
        '200':
          description: Usuário encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '204':
          description: Usuário não encontrado
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [User]
      summary: Excluir usuário
      responses:
        '200':
          description: Usuário excluído com sucesso
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ─── UserInstitution ─────────────────────────────────────────────────────────

  /userinstitution:
    get:
      tags: [UserInstitution]
      summary: Listar vínculos usuário-instituição
      responses:
        '200':
          description: Lista de vínculos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserInstitution'
        '204':
          description: Nenhum vínculo encontrado
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [UserInstitution]
      summary: Criar vínculo usuário-instituição
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserInstitutionDTO'
      responses:
        '200':
          description: Vínculo criado com sucesso
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [UserInstitution]
      summary: Atualizar vínculo usuário-instituição
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserInstitutionDTO'
      responses:
        '200':
          description: Vínculo atualizado com sucesso
        '401':
          $ref: '#/components/responses/Unauthorized'

  /userinstitution/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [UserInstitution]
      summary: Buscar vínculo por ID
      responses:
        '200':
          description: Vínculo encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInstitution'
        '204':
          description: Vínculo não encontrado
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [UserInstitution]
      summary: Excluir vínculo usuário-instituição
      responses:
        '200':
          description: Vínculo excluído com sucesso
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ─── UserPermission ──────────────────────────────────────────────────────────

  /userpermission:
    post:
      tags: [UserPermission]
      summary: Atribuir permissão a usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserPermissionDTO'
      responses:
        '200':
          description: Permissão atribuída com sucesso
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /userpermission/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - description: ID do usuário
    get:
      tags: [UserPermission]
      summary: Listar permissões de um usuário agrupadas por página
      description: O `{id}` é o ID do **usuário** (não da permissão).
      responses:
        '200':
          description: Permissões agrupadas por página/controller
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserPermissionPage'
        '404':
          description: Usuário não encontrado
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [UserPermission]
      summary: Remover permissão de usuário
      description: O `{id}` é o ID da entrada de permissão a remover.
      responses:
        '200':
          description: Permissão removida com sucesso
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ─── UserType ────────────────────────────────────────────────────────────────

  /usertype:
    get:
      tags: [UserType]
      summary: Listar tipos de usuário
      responses:
        '200':
          description: Lista de tipos de usuário
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserType'
        '204':
          description: Nenhum tipo encontrado
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [UserType]
      summary: Criar tipo de usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserTypeDTO'
      responses:
        '200':
          description: Tipo de usuário criado com sucesso
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [UserType]
      summary: Atualizar tipo de usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserTypeDTO'
      responses:
        '200':
          description: Tipo de usuário atualizado com sucesso
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /usertype/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [UserType]
      summary: Buscar tipo de usuário por ID
      responses:
        '200':
          description: Tipo de usuário encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserType'
        '204':
          description: Tipo de usuário não encontrado
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [UserType]
      summary: Excluir tipo de usuário
      responses:
        '200':
          description: Tipo de usuário excluído com sucesso
        '401':
          $ref: '#/components/responses/Unauthorized'

# ─── Components ──────────────────────────────────────────────────────────────

components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT obtido em `POST /auth`. Enviar como `Authorization: Bearer <token>`.
        Claims: NameIdentifier=userId, Name=nickname. Expira em 60 minutos.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Identificador único (UUID v4)

  responses:
    ValidationError:
      description: Dados de entrada inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
          example:
            is_valid: false
            errors:
              nickname: ["O campo nickname é obrigatório"]
    Unauthorized:
      description: Token JWT ausente, expirado ou inválido
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Token inválido ou expirado

  schemas:

    # ── Auth ──────────────────────────────────────────────────────────────────

    CredentialsDTO:
      type: object
      required: [nickname, password]
      properties:
        nickname:
          type: string
          example: john.doe
        password:
          type: string
          format: password
          example: "secret123"

    AuthResponse:
      type: object
      properties:
        idUser:
          type: string
          format: uuid
          description: ID do usuário autenticado
        accessToken:
          type: string
          description: JWT Bearer token (expira em 60 min)
        institutions:
          type: array
          description: Instituições às quais o usuário pertence
          items:
            $ref: '#/components/schemas/Institution'

    # ── Action ────────────────────────────────────────────────────────────────

    Action:
      type: object
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        name:
          type: string
        description:
          type: string
          nullable: true
        withoutOwner:
          type: boolean
          description: Ação pode ser executada sem dono de talão
        otherOwner:
          type: boolean
          description: Ação pode ser executada por outro dono

    CreateActionDTO:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        withoutOwner:
          type: boolean
          nullable: true
        otherOwner:
          type: boolean
          nullable: true

    UpdateActionDTO:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        withoutOwner:
          type: boolean
          nullable: true
        otherOwner:
          type: boolean
          nullable: true

    # ── Institution ───────────────────────────────────────────────────────────

    Institution:
      type: object
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        name:
          type: string
        slugName:
          type: string
          description: Identificador URL-friendly (ex: minha-instituicao)
        shortName:
          type: string
          description: Nome abreviado da instituição
        description:
          type: string
          nullable: true
        logoDirectory:
          type: string
          nullable: true
          description: Caminho ou URL do logo

    CreateInstitutionDTO:
      type: object
      required: [name, slugName, shortName]
      properties:
        name:
          type: string
        slugName:
          type: string
        shortName:
          type: string
        description:
          type: string
          nullable: true
        logoDirectory:
          type: string
          nullable: true

    UpdateInstitutionDTO:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
        slugName:
          type: string
          nullable: true
        shortName:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        logoDirectory:
          type: string
          nullable: true

    # ── Lottery ───────────────────────────────────────────────────────────────

    Lottery:
      type: object
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        idInstitution:
          type: string
          format: uuid
        name:
          type: string
        numTicketsTicketbook:
          type: integer
          description: Número de bilhetes por talão
        numTicketbooks:
          type: integer
          description: Número total de talões
        priceTicket:
          type: number
          format: double
          description: Preço por bilhete
        doubleChance:
          type: boolean
          description: Se cada bilhete concorre duas vezes

    CreateLotteryDTO:
      type: object
      required: [name, numTicketsTicketbook, numTicketbooks, priceTicket, doubleChance]
      properties:
        idInstitution:
          type: string
          format: uuid
          description: Ignorado — usa-se o idInstitution da rota
        name:
          type: string
        numTicketsTicketbook:
          type: integer
          minimum: 1
        numTicketbooks:
          type: integer
          minimum: 1
        priceTicket:
          type: number
          minimum: 1
        doubleChance:
          type: boolean

    UpdateLotteryDTO:
      type: object
      required: [id, name, numTicketsTicketbook, numTicketbooks, priceTicket, doubleChance]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        numTicketsTicketbook:
          type: integer
          minimum: 1
        numTicketbooks:
          type: integer
          minimum: 1
        priceTicket:
          type: number
          minimum: 1
        doubleChance:
          type: boolean

    # ── Page ──────────────────────────────────────────────────────────────────

    Page:
      type: object
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        name:
          type: string
          description: Corresponde ao nome do controller
        description:
          type: string
          nullable: true

    CreatePage:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true

    UpdatePage:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true

    # ── Permission ────────────────────────────────────────────────────────────

    Permission:
      type: object
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        idInstitution:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true

    CreatePermissionDTO:
      type: object
      required: [idInstitution, name]
      properties:
        idInstitution:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true

    UpdatePermissionDTO:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true

    # ── StatusTicketbook ──────────────────────────────────────────────────────

    StatusTicketbook:
      type: object
      properties:
        id:
          type: integer
          description: "Valores padrão: 1 = Retirado, 2 = Devolvido"
        name:
          type: string

    CreateStatusTicketbookDTO:
      type: object
      required: [name]
      properties:
        name:
          type: string

    UpdateStatusTicketbookDTO:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true

    # ── TableConfiguration ────────────────────────────────────────────────────

    TableConfiguration:
      type: object
      description: Metadados de uma coluna (information_schema.columns)
      properties:
        tableSchema:
          type: string
          description: "Schema do banco (ex: edoha, lottery)"
        tableName:
          type: string
        columnName:
          type: string
        ordinalPosition:
          type: integer
          description: Posição da coluna na tabela
        columnDefault:
          type: string
          nullable: true
        isNullable:
          type: string
          description: "YES ou NO"
        dataType:
          type: string
          description: "Tipo SQL (ex: uuid, text, integer, boolean)"

    # ── Ticket ────────────────────────────────────────────────────────────────

    Ticket:
      type: object
      properties:
        idTicketbook:
          type: string
          format: uuid
        idDonater:
          type: string
          format: uuid
          nullable: true
          description: ID do usuário que comprou o bilhete
        number:
          type: integer
          description: Número do bilhete dentro do talão
        soldDate:
          type: string
          format: date-time
          nullable: true

    CreateTicketRequest:
      type: object
      required: [number]
      properties:
        donaterName:
          type: string
          nullable: true
          description: Nome do comprador (lookup por telefone ou criação)
        donaterPhone:
          type: string
          nullable: true
        number:
          type: integer
          minimum: 1
        soldDate:
          type: string
          format: date-time
          nullable: true

    UpdateTicketDTO:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
        idDonater:
          type: string
          format: uuid
          nullable: true
        soldDate:
          type: string
          format: date-time
          nullable: true

    # ── Ticketbook ────────────────────────────────────────────────────────────

    Ticketbook:
      type: object
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        idLottery:
          type: string
          format: uuid
        ticketbookOwner:
          $ref: '#/components/schemas/PersonWithId'
        ticketbookHolder:
          allOf:
            - $ref: '#/components/schemas/PersonWithId'
          nullable: true
        idStatusTicketbook:
          type: integer
          description: "1 = Retirado, 2 = Devolvido"
        number:
          type: integer
          description: Número sequencial do talão na rifa
        withdrawnDate:
          type: string
          format: date-time
          nullable: true
        devolutionDate:
          type: string
          format: date-time
          nullable: true
        tickets:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/Ticket'

    PostTicketbookRequest:
      type: object
      required: [ticketbookOwner, idStatusTicketbook, number]
      properties:
        ticketbookOwner:
          $ref: '#/components/schemas/Person'
        ticketbookHolder:
          allOf:
            - $ref: '#/components/schemas/Person'
          nullable: true
        idStatusTicketbook:
          type: integer
          description: "1 = Retirado, 2 = Devolvido"
        number:
          type: integer
          minimum: 1
        withdrawnDate:
          type: string
          format: date-time
          nullable: true
        devolutionDate:
          type: string
          format: date-time
          nullable: true

    PostTicketbookResponse:
      type: object
      properties:
        idTicketbook:
          type: string
          format: uuid

    UpdateTicketbookDTO:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
        idOwner:
          type: string
          format: uuid
          nullable: true
          description: ID do usuário que assume como dono
        idHolder:
          type: string
          format: uuid
          nullable: true
          description: ID do usuário que fica como portador
        idStatusTicketbook:
          type: integer
          minimum: 1
        withdrawnDate:
          type: string
          format: date-time
          nullable: true
        devolutionDate:
          type: string
          format: date-time
          nullable: true

    Person:
      type: object
      description: Pessoa identificada por nome e telefone (usada na criação de talão)
      properties:
        name:
          type: string
        phone:
          type: string

    PersonWithId:
      type: object
      description: Pessoa com ID de usuário (retornada nas leituras de talão)
      properties:
        id:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        phone:
          type: string

    # ── User ──────────────────────────────────────────────────────────────────

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        name:
          type: string
        phone:
          type: string
          nullable: true
        nickname:
          type: string
          nullable: true
        institutions:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/Institution'

    CreateUserInputModel:
      type: object
      required: [name]
      properties:
        name:
          type: string
        phone:
          type: string
          nullable: true
        nickname:
          type: string
          nullable: true
        unhashedPassword:
          type: string
          format: password
          nullable: true
          description: Senha em texto puro — será hasheada com bcrypt

    UpdateUserDTO:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        nickname:
          type: string
          nullable: true

    UserInformationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        phone:
          type: string

    # ── UserInstitution ───────────────────────────────────────────────────────

    UserInstitution:
      type: object
      properties:
        idUser:
          type: string
          format: uuid
        idInstitution:
          type: string
          format: uuid
        createAt:
          type: string
          format: date-time
        createBy:
          type: string
          format: uuid
          nullable: true

    CreateUserInstitutionDTO:
      type: object
      required: [idUser, idInstitution]
      properties:
        idUser:
          type: string
          format: uuid
        idInstitution:
          type: string
          format: uuid

    UpdateUserInstitutionDTO:
      type: object
      required: [idUser, idInstitution]
      properties:
        idUser:
          type: string
          format: uuid
        idInstitution:
          type: string
          format: uuid

    # ── UserPermission ────────────────────────────────────────────────────────

    CreateUserPermissionDTO:
      type: object
      required: [idUser, idPage, idPermission, idAction]
      properties:
        idUser:
          type: string
          format: uuid
        idPage:
          type: string
          format: uuid
          description: ID do Page (controller)
        idPermission:
          type: string
          format: uuid
          description: ID do perfil de Permission
        idAction:
          type: string
          format: uuid
          description: ID da Action (verbo HTTP)

    UserPermissionPage:
      type: object
      description: Permissões de um usuário agrupadas por página (controller)
      properties:
        pageName:
          type: string
          description: Nome do controller/página
        actions:
          type: array
          items:
            $ref: '#/components/schemas/Action'

    # ── UserType ──────────────────────────────────────────────────────────────

    UserType:
      type: object
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        nameUserType:
          type: string

    CreateUserTypeDTO:
      type: object
      required: [nameUserType]
      properties:
        nameUserType:
          type: string

    UpdateUserTypeDTO:
      type: object
      required: [id, nameUserType]
      properties:
        id:
          type: string
          format: uuid
        nameUserType:
          type: string

    # ── Errors ────────────────────────────────────────────────────────────────

    ValidationErrorResponse:
      type: object
      properties:
        is_valid:
          type: boolean
          example: false
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            nickname: ["O campo nickname é obrigatório"]
            password: ["O campo password é obrigatório"]
